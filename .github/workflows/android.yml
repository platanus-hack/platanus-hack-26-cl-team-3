name: Android APK
on:
  push:
    branches: [dev, main]
permissions:
  contents: read
concurrency:
  group: android-${{ github.ref }}-${{ github.sha }}
  cancel-in-progress: false

jobs:
  apk:
    if: github.repository == 'platanus-hack/platanus-hack-26-cl-team-3'
    runs-on: ubuntu-24.04
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803
        with:
          persist-credentials: false
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: '22'
      - name: Prepare build tools and Android version code
        run: |
          echo "JAVA_HOME=$JAVA_HOME_17_X64" >> "$GITHUB_ENV"
          "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" 'platforms;android-37.0' 'build-tools;37.0.0' 'ndk;27.1.12297006' 'cmake;3.22.1'
          # Both branches share an Android application ID and signing key.
          export APK_CODE=$((1000000 + GITHUB_RUN_NUMBER))
          echo "APK_CODE=$APK_CODE" >> "$GITHUB_ENV"
          node -e 'const fs = require("node:fs"); const path = "app/app.json"; const config = require("./" + path); config.expo.android.versionCode = Number(process.env.APK_CODE); fs.writeFileSync(path, JSON.stringify(config));'
      - name: Build and verify installable package
        env:
          NODE_ENV: production
          NPM_CONFIG_INCLUDE: dev
        run: |
          bash scripts/compilar-apk.sh
          tools="$ANDROID_HOME/build-tools/37.0.0"
          "$tools/apksigner" verify --print-certs dist/capo-ar.apk > "$RUNNER_TEMP/signer"
          grep -Fx 'V2 Signer: certificate SHA-256 digest: fac61745dc0903786fb9ede62a962b399f7348f0bb6f899b8332667591033b9c' "$RUNNER_TEMP/signer"
          "$tools/aapt2" dump badging dist/capo-ar.apk > "$RUNNER_TEMP/package"
          grep -F "package: name='com.capoar.app' versionCode='$APK_CODE'" "$RUNNER_TEMP/package"
          grep -Fx "native-code: 'arm64-v8a'" "$RUNNER_TEMP/package"
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: android-package
          path: dist/capo-ar.apk
          if-no-files-found: error
          retention-days: 1

  publish:
    needs: apk
    concurrency:
      group: publish-android-${{ github.ref }}-${{ github.ref_name == 'dev' && github.sha || 'latest' }}
      queue: max
    runs-on: ubuntu-24.04
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803
        with:
          persist-credentials: false
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093
        with:
          name: android-package
          path: dist
      - name: Publish verified APK
        env:
          GH_TOKEN: ${{ github.token }}
        run: bash scripts/publish-apk.sh
