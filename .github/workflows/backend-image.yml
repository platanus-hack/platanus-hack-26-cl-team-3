name: Backend image

on:
  pull_request:
    paths:
      - 'api/**'
      - '.github/workflows/backend-image.yml'
  push:
    branches: [main]
    paths:
      - 'api/**'
      - '.github/workflows/backend-image.yml'

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: '22.12.0'
      - name: Check backend
        working-directory: api
        run: |
          npm ci
          npm run typecheck
          npm test
      - name: Verify production container
        run: |
          docker build --label "org.opencontainers.image.source=$GITHUB_SERVER_URL/$GITHUB_REPOSITORY" \
            --label "org.opencontainers.image.revision=$GITHUB_SHA" -t backend:test api
          docker run -d --name backend -p 127.0.0.1:8787:8787 backend:test
          curl --fail --retry 15 --retry-all-errors --retry-delay 1 http://127.0.0.1:8787/api/health | jq -e '.ok == true'

      - name: Save verified image
        if: github.event_name == 'push'
        run: docker save backend:test | gzip > "${RUNNER_TEMP}/backend.tar.gz"
      - uses: actions/upload-artifact@v4
        if: github.event_name == 'push'
        with:
          name: backend-image
          path: ${{ runner.temp }}/backend.tar.gz
          retention-days: 1
          compression-level: 0

  publish:
    if: github.event_name == 'push'
    needs: verify
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: backend-image
          path: ${{ runner.temp }}
      - name: Publish the backend for this revision
        env:
          REGISTRY_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          image="ghcr.io/${GITHUB_REPOSITORY,,}-api"
          docker load -i "$RUNNER_TEMP/backend.tar.gz"
          docker tag backend:test "$image:$GITHUB_SHA"
          printf '%s' "$REGISTRY_TOKEN" | docker login ghcr.io -u "$GITHUB_ACTOR" --password-stdin
          docker push "$image:$GITHUB_SHA"
