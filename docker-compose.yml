services:
  web:
    build: .
    image: ${COMPOSE_PROJECT_NAME}-web:latest
    pull_policy: never
    restart: unless-stopped
    networks: [proxy]
    labels:
      - "io.github-runners.repository-id=0"
      - "traefik.enable=true"
      - "traefik.docker.network=proxy"
      - "traefik.http.routers.app-0.rule=Host(`starter.invalid`)"
      - "traefik.http.routers.app-0.entrypoints=websecure"
      - "traefik.http.routers.app-0.tls=true"
      - "traefik.http.routers.app-0.middlewares=cloudflare-only@file"
      - "traefik.http.routers.app-0.service=app-0"
      - "traefik.http.services.app-0.loadbalancer.server.port=8080"
      - "monitoring.url=https://starter.invalid"
networks:
  proxy:
    external: true
