services:
  web:
    build: .
    image: ${COMPOSE_PROJECT_NAME}-web:latest
    pull_policy: never
    restart: unless-stopped
    networks: [proxy]
    labels:
      - "io.github-runners.repository-id=1466158396"
      - "traefik.enable=true"
      - "traefik.docker.network=proxy"
      - "traefik.http.routers.app-1466158396.rule=Host(`${CAPO_AR_DOMAIN:-ph26.berguecio.cl}`)"
      - "traefik.http.routers.app-1466158396.entrypoints=websecure"
      - "traefik.http.routers.app-1466158396.tls=true"
      - "traefik.http.routers.app-1466158396.middlewares=cloudflare-only@file"
      - "traefik.http.routers.app-1466158396.service=app-1466158396"
      - "traefik.http.services.app-1466158396.loadbalancer.server.port=8080"
      - "monitoring.url=https://${CAPO_AR_DOMAIN:-ph26.berguecio.cl}"
  prt-seed:
    build: ./scripts/prt
    restart: on-failure
    volumes:
      - prt-seed:/seed
      - ${PRT_DATA_DIR:-./api/data}:/existing:ro
  api:
    depends_on: [prt-seed]
    build: ./api
    image: ${COMPOSE_PROJECT_NAME}-api:latest
    pull_policy: never
    restart: unless-stopped
    environment:
      PRT_SEED_PATH: /app/prt-seed/vehicles.sqlite
      ANTHROPIC_API_KEY: ${ANTHROPIC_API_KEY}
      ELEVENLABS_API_KEY: ${ELEVENLABS_API_KEY}
      LOGS_TOKEN: ${LOGS_TOKEN}
      HISTORIAL_DB: /app/historial/historial.sqlite
      MANUAL_INDEX: /app/.manual/outback-2016.json
    volumes:
      - ${PRT_DATA_DIR:-./api/data}:/app/data:ro
      - prt-seed:/app/prt-seed:ro
      - historial:/app/historial
      - ${MANUAL_DIR:-./api/.manual}:/app/.manual:ro
    networks: [proxy]
    labels:
      - "traefik.enable=true"
      - "traefik.docker.network=proxy"
      - "traefik.http.routers.api-1466158396.rule=Host(`${CAPO_AR_DOMAIN:-ph26.berguecio.cl}`) && PathPrefix(`/api`)"
      - "traefik.http.routers.api-1466158396.entrypoints=websecure"
      - "traefik.http.routers.api-1466158396.tls=true"
      - "traefik.http.routers.api-1466158396.middlewares=cloudflare-only@file"
      - "traefik.http.routers.api-1466158396.service=api-1466158396"
      - "traefik.http.services.api-1466158396.loadbalancer.server.port=8787"
networks:
  proxy:
    external: true

volumes:
  prt-seed:
  historial:
